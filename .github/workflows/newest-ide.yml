# Once a week, and on demand, runs the IntelliJ Plugin Verifier against the newest IntelliJ IDEA releases, RCs and
# EAPs from Skein's since-build on (recommended() in build.gradle.kts, switched on by -PverifyNewestIdes=true) instead
# of the IntelliJ IDEA 2026.3 the Build workflow pins. Skein leans on the terminal's experimental API, so a new IDE
# can break it while every build stays green; this run turns red then. Nothing depends on it: it gates no pull
# request, build or release, and it only reads the Gradle cache the builds of main write.
name: Newest IDE

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newest-ide
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the plugin against the newest IDEs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # the open-source cache implementation, not the closed "enhanced" provider
          cache-provider: basic
          # a scheduled run is a run on main, which would save its Gradle home (newer IDEs included) over the cache
          # the builds of main and the pull requests restore; it only reads it
          cache-read-only: true

      - name: Verify against the newest IDEs
        run: ./gradlew verifyPlugin -PverifyNewestIdes=true --console=plain

      - name: Keep the verifier report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verifier-report
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
